<!doctype html>
<html lang="en" class="booting" style="background:#000">
<head>
<base href="../">
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{background:#000}</style>


<title>Lyceum</title>
<meta name="description" content="A morning news briefing with Greek philosophy.">
<link rel="manifest" href="test/manifest-k.webmanifest">
<link rel="icon" type="image/png" href="mark-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="mark-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1d3d" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap" onload="this.onload=null;this.rel='stylesheet';window.__fcss=1">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap"></noscript>
<style>html{background:#000}</style>
</head>
<body>
<div id="lyProbe" aria-hidden="true" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)"></div>
<div id="splash" aria-hidden="true"><svg viewBox="0 0 56 49"><path d="M0 13.5 28 0l28 13.5Z"/><rect x="1.5" y="16" width="53" height="5.5" rx="1"/><rect x="3.1" y="24.5" width="6.2" height="18" rx="1.4"/><rect x="14" y="24.5" width="6.2" height="18" rx="1.4"/><rect x="24.9" y="24.5" width="6.2" height="18" rx="1.4"/><rect x="35.8" y="24.5" width="6.2" height="18" rx="1.4"/><rect x="46.7" y="24.5" width="6.2" height="18" rx="1.4"/><rect y="45" width="56" height="4" rx="1"/></svg><div class="name">LYCEUM</div></div>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="key-brass" width="24" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 19.2H24M0 19.2V.8H19.2V15.2H8V8H12V12" fill="none" style="stroke: var(--brass)" stroke-width="1.4" stroke-linecap="square"/>
    </pattern>
    <pattern id="key-gold" width="24" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 19.2H24M0 19.2V.8H19.2V15.2H8V8H12V12" fill="none" style="stroke: var(--gold)" stroke-width="1.4" stroke-linecap="square"/>
    </pattern>
  </defs>
</svg>

<header class="masthead">
  <div class="wrap">
    <svg class="emblem" viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 15 32 3l27 12Z"/><path d="M5 19h54M2 41h60M4 44h56" stroke-linecap="round"/>
      <path d="M11 23v15M22 23v15M32 23v15M42 23v15M53 23v15" stroke-linecap="round" stroke-width="3.4"/>
    </svg>
    <h1 class="brand">LYCEUM</h1>
    <div class="dateline" id="date"></div>
    <div class="greeting"><div class="greek" id="greek"></div><div class="gloss" id="gloss"></div></div>
    <div class="cities" id="cities"></div>
  </div>
  <svg class="key" aria-hidden="true"><rect width="100%" height="20" fill="url(#key-brass)"/></svg>
</header>

<nav class="bar" aria-label="Sections">
  <div class="wrap bar-in">
    <div class="chips" id="chips" role="tablist"></div>
    <div class="tools">
      <span class="count" id="count" aria-live="polite"></span>
      <button class="iconbtn" id="refresh" type="button" aria-label="Refresh edition">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
</nav>

<main class="wrap">
  <div class="banner" id="install" hidden>
    <p><b>Keep Lyceum on your Home Screen.</b> In Safari, tap Share, then Add to Home Screen.</p>
    <button class="iconbtn" id="dismiss" type="button" aria-label="Dismiss"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>

  <div class="banner alertcard" id="alert" hidden></div>

  <section class="logos" id="logos" aria-label="Daily Logos"></section>
  <section class="reading" id="reading" aria-label="Today’s reading" hidden></section>

  <div id="edition">
    <div class="skel"><i></i><i></i><i></i></div>
    <div class="skel"><i></i><i></i><i></i></div>
    <div class="skel"><i></i><i></i><i></i></div>
  </div>

  <footer id="footer" hidden>
    <svg class="key" aria-hidden="true"><rect width="100%" height="20" fill="url(#key-gold)"/></svg>
    <div class="done">That is all for now.</div>
    <div class="chaire" id="chaire">Χαῖρε</div><div class="gloss" id="chaireGloss" style="margin-top:2px">“farewell”</div>
    <div class="know">γνῶθι σεαυτόν · know thyself</div>
    <div class="src" id="sources"></div>
    <div class="updated" id="streak"></div>
    <div class="updated" id="updated"></div>
    <button class="pill" id="alertLink" type="button" hidden style="margin-top:14px">Morning alert settings</button>
    <div><button class="pill" id="diagLink" type="button" style="margin-top:10px">Launch diagnostics</button></div>
  </footer>
</main>
<div id="reader" hidden role="dialog" aria-modal="true" aria-label="Today’s reading">
  <div class="rd-bar">
    <div class="rd-row">
      <button class="iconbtn" id="rdClose" type="button" aria-label="Close reading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="rd-title"><b id="rdTitle"></b><small id="rdSub"></small></div>
      <button class="iconbtn rd-aa" id="rdSize" type="button" aria-label="Change text size">Aa</button>
    </div>
    <div class="rd-progress" aria-hidden="true"><i id="rdBar"></i></div>
  </div>
  <article class="rd-body" id="rdBody"></article>
  <div class="rd-end" id="rdEnd" hidden></div>
</div>
<div class="toast" id="toast" role="status"></div>


</body>
</html>
