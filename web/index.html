  html.booting body > *:not(#splash) { visibility: hidden; }
  #splash { position: fixed; inset: auto 0 0 0; height: var(--sh, 100vh); z-index: 200; display: grid; place-items: center; background: #000; transition: opacity .5s ease, visibility 0s linear .5s; will-change: opacity; transform: translateZ(0); backface-visibility: hidden; }
  #splash.off { opacity: 0; visibility: hidden; }
  /* the logo waits for iOS to finish opening the app (plain black until then), then fades in */
  #splash svg, #splash .name { opacity: 0; }
  #splash.go svg, #splash.go .name { animation: splashIn .4s ease forwards; }
  @keyframes splashIn { to { opacity: 1; } }
  #splash svg { width: 22vw; height: auto; fill: #faf6ec; display: block; }
  #splash .name { position: absolute; left: 0; right: 0; bottom: calc(var(--sb, 0px) + 38px); text-align: center; font-family: "Cinzel Splash", "Cinzel", Georgia, serif; font-weight: 700; font-size: 15px; letter-spacing: .42em; padding-left: .42em; color: #faf6ec; line-height: 1; }

<meta name="description" content="A morning news briefing with Greek philosophy.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="mark-192.png">

<style>
  /* Layout: navy masthead band, sticky section bar, then one reading column.
     Serif for reading, system sans for interface chrome, Cinzel for the brand only. */
  :root {
    --paper: #eef0ec; --card: #fafaf7; --ink: #0f1b33; --muted: #566074; --rule: #d6dad4;
    --aegean: #1b4b82; --gold: #7c5f1a; --clay: #a33f23; --olive: #52632c; --teal: #0e6f69; --violet: #5a4aa8; --plum: #98386f;
    --bar: rgba(238, 240, 236, 0.84); --shadow: 0 1px 2px rgba(15, 27, 51, .06), 0 8px 24px -12px rgba(15, 27, 51, .18);
    --navy: #0b1d3d; --navy-2: #16396a; --ivory: #f3efe3; --brass: #e0c57a;
    --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
    --greek: "EB Garamond", "Iowan Old Style", Palatino, Georgia, serif;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    --bar-h: 54px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #000000; --card: #0d0d0f; --ink: #ece9de; --muted: #98a3b9; --rule: #1d1d21; --navy: #000000; --navy-2: #0c0c0e;
      --aegean: #8db8ea; --gold: #ddbd6a; --clay: #ea926c; --olive: #afc17d; --teal: #5fc4b8; --violet: #aa9ef2; --plum: #e68cbf;
      --bar: rgba(0, 0, 0, 0.86); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #000000; --card: #0d0d0f; --ink: #ece9de; --muted: #98a3b9; --rule: #1d1d21; --navy: #000000; --navy-2: #0c0c0e;
    --aegean: #8db8ea; --gold: #ddbd6a; --clay: #ea926c; --olive: #afc17d; --teal: #5fc4b8; --violet: #aa9ef2; --plum: #e68cbf;
    --bar: rgba(0, 0, 0, 0.86); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--serif); font-size: 17px; line-height: 1.5;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  }
  /* Paints the status-bar area navy so the clock stays readable in either theme. */
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: calc(env(safe-area-inset-top, 0px) + 30px); pointer-events: none;
    background: linear-gradient(to bottom, var(--navy) calc(100% - 30px), color-mix(in srgb, var(--navy) 0%, transparent) 100%); z-index: 60;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--aegean); outline-offset: 3px; border-radius: 6px; }

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>

  <div class="rd-end" id="rdEnd" hidden></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
function lyceumMain() {
  var NAME = "Vibhor";
  var CITIES = [{ label: "Melbourne", tz: "Australia/Melbourne" }, { label: "Mumbai", tz: "Asia/Kolkata" }];
  var REALMS = {
    polis:     { name: "Polis",     greek: "Πόλις",     gloss: "city-state", sub: "Geopolitics & the world",       mark: "Π" },
    oikos:     { name: "Oikos",     greek: "Οἶκος",     gloss: "household, home", sub: "Home & away: Australia, India", mark: "Ο" },
    techne:    { name: "Techne",    greek: "Τέχνη",     gloss: "craft, art", sub: "Technology & AI",               mark: "Τ" },
    kosmos:    { name: "Kosmos",    greek: "Κόσμος",    gloss: "order, the world", sub: "Space, EVs & the Musk orbit",   mark: "Κ" },
    oikonomia: { name: "Oikonomia", greek: "Οἰκονομία", gloss: "household management", sub: "Markets & business",            mark: "Χ" },
    arete:     { name: "Arete",     greek: "Ἀρετή",     gloss: "excellence, virtue", sub: "Discipline & longevity",        mark: "Α" },
    sophia:    { name: "Sophia",    greek: "Σοφία",     gloss: "wisdom", sub: "Ideas worth your time",         mark: "Σ" },
    schole:    { name: "Schole",    greek: "Σχολή",     gloss: "leisure", sub: "Rock, football & play",         mark: "Φ" }
  };
  var ORDER = ["polis", "oikos", "techne", "kosmos", "oikonomia", "arete", "sophia", "schole"];
  var BOOK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5Z"/><path d="M4 19V5.5M8 7h8"/></svg>';
  var SHARE_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  var $ = function (id) { return document.getElementById(id); };
  var lastLoaded = 0, edition = null, readSet = {}, readList = [], total = 0, sections = [];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function idbPut(key, val) {
    try {
      var r = indexedDB.open("lyceum", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
      r.onsuccess = function () { try { r.result.transaction("kv", "readwrite").objectStore("kv").put(val, key); } catch (e) {} };
    } catch (e) {}
  }
  function saveRead() {
    readList = readList.slice(-500);
    store("lyceum-read", { links: readList });
    idbPut("read", readList);
  }
  function store(key, val) {
    try { if (val === undefined) return JSON.parse(localStorage.getItem(key)); localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; }
  }

  /* ---- masthead ---- */
  function header() {
    var now = new Date(), h = now.getHours();
    $("date").textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
    var g = h >= 4 && h < 12 ? ["Καλημέρα", "good morning"] : h >= 12 && h < 18 ? ["Χαῖρε", "greetings"] : ["Καλησπέρα", "good evening"];
    $("greek").textContent = g[0] + ", " + NAME;
    $("gloss").textContent = "“" + g[1] + ", " + NAME + "”";
    $("chaire").textContent = "Χαῖρε, " + NAME;
    $("chaireGloss").textContent = "“farewell, " + NAME + "”  ·  until tomorrow";
    clocks();
  }
  var weather = [];
  function clocks() {
    var box = $("cities");
    if (!box.children.length) {
      CITIES.forEach(function (c) {
        var d = el("div", "city"); d.appendChild(el("div", "cn")); d.appendChild(el("div", "cw")); box.appendChild(d);
      });
    }
    CITIES.forEach(function (c, i) {
      var t = new Date().toLocaleTimeString("en-AU", { timeZone: c.tz, hour: "numeric", minute: "2-digit", hour12: true }).toUpperCase().replace(/\s/g, "\u00A0");
      var w = weather.filter(function (x) { return x.city === c.label; })[0];
      box.children[i].children[0].textContent = c.label + " · " + t;
      box.children[i].children[1].textContent = w ? w.lo + "°–" + w.hi + "°  " + w.desc : " ";
    });
  }
  function dayKey(d) { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function dayNumber() { var d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
  function recordDay() {
    var days = store("lyceum-days") || [], k = dayKey();
    if (days.indexOf(k) < 0) { days.push(k); store("lyceum-days", days.slice(-400)); }
    brief();
  }
  function streak() {
    var set = {}, n = 0, d = new Date();
    (store("lyceum-days") || []).forEach(function (k) { set[k] = 1; });
    if (!set[dayKey(d)]) d.setDate(d.getDate() - 1);
    while (set[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function brief() {
    var n = streak();
    $("streak").textContent = n ? n + "-day reading streak" : "";
  }
  function ago(iso) {
    var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (isNaN(m) || m < 0) return "";
    if (m < 60) return Math.max(m, 1) + "m ago";
    if (m < 1440) return Math.round(m / 60) + "h ago";
    return Math.round(m / 1440) + "d ago";
  }
  function words(s) { return s ? s.split(/\s+/).length : 0; }

  /* ---- daily logos ---- */
  function renderMaxim(maxims) {
    var box = $("logos");
    if (!maxims || !maxims.length) { box.hidden = true; return; }
    box.hidden = false;
    var d = new Date();
    var day = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
    var m = maxims[day % maxims.length];
    box.textContent = "";
    box.appendChild(el("div", "wm", "λόγος")).setAttribute("aria-hidden", "true");
    box.appendChild(el("div", "eyebrow", "The Daily Logos"));
    box.appendChild(el("span", "gloss", "λόγος  ·  “word, reason”"));
    box.appendChild(el("blockquote", null, "“" + m.text + "”"));
    box.appendChild(el("div", "author", "— " + m.author));
    box.appendChild(document.createElement("hr"));
    box.appendChild(el("div", "eyebrow", "A lens for today’s news"));
    box.appendChild(el("p", "lens", m.lens));
  }

  /* ---- in-app reader ---- */
  var readingList = null, readerEntry = null;
  function closeReader(fromPop) {
    $("reader").hidden = true; document.body.classList.remove("rd-open");
    if (!fromPop && history.state && history.state.reader) { try { history.back(); } catch (e) {} }
  }
  function finishReading() {
    store("lyceum-reading", dayKey()); recordDay();
    closeReader(); toast("Done. See you tomorrow.");
    if (readingList) renderReading(readingList);
  }
  function renderPassage(r, paras) {
    var body = $("rdBody"), end = $("rdEnd");
    body.textContent = "";
    var intro = el("div", "rd-intro");
    intro.appendChild(el("span", "eyebrow", "Today’s reading"));
    intro.appendChild(el("h1", null, r.work + " · " + r.part));
    intro.appendChild(el("p", null, r.why));
    body.appendChild(intro);
    var first = true;
    paras.forEach(function (p) {
      if (typeof p === "object") { body.appendChild(el("h2", "rd-h", p.h)); first = false; return; }
      var node = el("p"), text = p, m;
      if ((m = text.match(/^(\d+|[IVXLC]+)\.\s+/))) { node.appendChild(el("span", "pnum", m[1])); text = text.slice(m[0].length); }
      else if ((m = text.match(/^([A-Z][A-Z ]{1,24}):\s+/))) {
        var nm = m[1].toLowerCase().replace(/(^|\s)\S/g, function (c) { return c.toUpperCase(); });
        node.appendChild(el("span", "spk", nm)); text = text.slice(m[0].length);
      } else if (first && /^[A-Za-z]/.test(text)) node.className = "drop";
      first = false;
      node.appendChild(document.createTextNode(text));
      body.appendChild(node);
    });
    end.textContent = ""; end.hidden = false;
    var k = document.createElementNS("http://www.w3.org/2000/svg", "svg"); k.setAttribute("class", "key"); k.setAttribute("aria-hidden", "true");
    k.innerHTML = '<rect width="100%" height="20" fill="url(#key-gold)"/>'; end.appendChild(k);
    end.appendChild(el("h2", null, "That is today’s reading."));
    end.appendChild(el("p", null, "Χαῖρε"));
    var fg = el("span", "gloss", "“farewell”  ·  well read"); fg.style.cssText = "display:block;margin:-14px 0 18px"; end.appendChild(fg);
    end.appendChild(pill("Mark as read", "solid", finishReading));
    var full = el("a", "full", "Read the full text on the web"); full.href = r.url; full.target = "_blank"; full.rel = "noopener";
    end.appendChild(full);
  }
  function openReader(r) {
    var box = $("reader"), body = $("rdBody");
    readerEntry = r;
    $("rdTitle").textContent = r.work + " · " + r.part;
    $("rdSub").textContent = r.author + " · about " + r.minutes + " min";
    var size = store("lyceum-rdsize"); box.className = "rd-s" + (size == null ? 1 : size);
    body.textContent = ""; body.appendChild(el("p", "rd-loading", "Opening today’s reading…"));
    $("rdEnd").hidden = true; $("rdBar").style.width = "0";
    box.hidden = false; box.scrollTop = 0; document.body.classList.add("rd-open");
    try { history.pushState({ reader: 1 }, ""); } catch (e) {}
    fetch(r.file).then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then(function (d) { renderPassage(r, d.p); })
      .catch(function () {
        body.textContent = "";
        var p = el("p", "rd-loading", "Couldn’t load today’s passage. Check your connection, or "); 
        var a = el("a", null, "read it on the web"); a.href = r.url; a.target = "_blank"; a.rel = "noopener"; a.style.textDecoration = "underline";
        p.appendChild(a); p.appendChild(document.createTextNode(".")); body.appendChild(p);
      });
  }
  $("rdClose").addEventListener("click", function () { closeReader(); });
  $("rdSize").addEventListener("click", function () {
    var cur = store("lyceum-rdsize"); cur = cur == null ? 1 : cur;
    var next = (cur + 1) % 3; store("lyceum-rdsize", next); $("reader").className = "rd-s" + next;
  });
  $("reader").addEventListener("scroll", function () {
    var r = $("reader"), max = r.scrollHeight - r.clientHeight;
    $("rdBar").style.width = max > 0 ? Math.min(100, r.scrollTop / max * 100) + "%" : "0";
  }, { passive: true });
  window.addEventListener("popstate", function () { if (!$("reader").hidden) closeReader(true); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("reader").hidden) closeReader(); });

  /* ---- today's reading ---- */
  function renderReading(list) {
    var box = $("reading");
    if (!list || !list.length) { box.hidden = true; return; }
    readingList = list;
    var r = list[dayNumber() % list.length], done = store("lyceum-reading") === dayKey();
    if (r.file) fetch(r.file).catch(function () {});   // warm the cache so it opens instantly
    box.hidden = false; box.textContent = "";
    var ico = el("div", "ico"); ico.innerHTML = BOOK_SVG; box.appendChild(ico);
    var head = el("div"); head.appendChild(el("div", "eyebrow", "Today’s reading")); box.appendChild(head);
    box.appendChild(el("h3", null, r.work + " · " + r.part));
    box.appendChild(el("p", "by", r.author + " · about " + r.minutes + " min"));
    box.appendChild(el("p", "why", r.why));
    var acts = el("div", "acts");
    var open;
    if (r.file) { open = pill("Read now · " + r.minutes + " min", "solid", function () { openReader(r); }); }
    else { open = el("a", "pill solid", "Open the text"); open.href = r.url; open.target = "_blank"; open.rel = "noopener"; }
    var tick = el("button", "pill" + (done ? " done" : ""), done ? "✓ Read today" : "Mark as read"); tick.type = "button";
    tick.addEventListener("click", function () {
      var now = store("lyceum-reading") === dayKey();
      store("lyceum-reading", now ? "" : dayKey());
      if (!now) recordDay();
      renderReading(list);
    });
    acts.appendChild(open); acts.appendChild(tick);
    box.appendChild(acts);
    // the grid places the first two children (icon, eyebrow) in row 1; the rest flow in column 2
    [].slice.call(box.children, 1).forEach(function (c) { c.style.gridColumn = "2"; });
  }

  /* ---- stories ---- */
  function picture(s, cls) {
    if (!s.image) return null;
    var wrap = el("div", cls), img = new Image();
    img.alt = ""; img.decoding = "async"; img.referrerPolicy = "no-referrer";
    img.loading = cls === "hero-img" ? "eager" : "lazy";
    img.onerror = function () {
      if (s.image_alt && img.src !== s.image_alt) { img.src = s.image_alt; return; }
      wrap.remove();
      var row = img.closest && img.closest(".story");
    };
    img.src = s.image;
    wrap.appendChild(img);
    return wrap;
  }

  function storyEl(s, n, lead, i) {
    var a = el("article", "story" + (lead ? " lead" : "") + (readSet[s.link] ? " read" : ""));
    a.style.setProperty("--i", i);
    a.dataset.link = s.link;
    var body = el("div", "body");
    var meta = el("div", "meta");
    var num = el("span", "num", readSet[s.link] ? "✓" : String(n));
    meta.appendChild(num);
    meta.appendChild(el("span", lead ? "tag" : null, s.source + " · " + ago(s.date)));
    body.appendChild(meta);
    var h = el("h3"), link = el("a", "cover", s.title);
    link.href = s.link; link.target = "_blank"; link.rel = "noopener";
    h.appendChild(link);
    body.appendChild(h);
    if (s.summary) body.appendChild(el("p", null, s.summary));

    var share = el("button", "iconbtn share");
    share.type = "button"; share.setAttribute("aria-label", "Share: " + s.title);
    share.innerHTML = SHARE_SVG;
    share.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); shareStory(s); });

    var pic = picture(s, lead ? "hero-img" : "thumb");
    if (lead) {
      if (pic) a.appendChild(pic);
      a.appendChild(body); a.appendChild(share);
    } else {
      a.appendChild(body);
      if (pic) a.appendChild(pic);
      meta.appendChild(share);
      share.style.marginLeft = "auto";
    }
    return a;
  }

  function renderStories(stories) {
    var root = $("edition"), n = 0, idx = 0;
    root.textContent = "";
    sections = [];
    ORDER.forEach(function (key) {
      var list = stories.filter(function (s) { return s.realm === key; });
      if (!list.length) return;
      var r = REALMS[key], sec = el("section", "realm " + key);
      sec.id = key;
      var head = el("div", "realm-head");
      head.appendChild(el("div", "mark", r.mark)).setAttribute("aria-hidden", "true");
      var t = el("div"), h2 = el("h2", null, r.name);
      var gk = el("div", "gk"); gk.appendChild(el("b", null, r.greek)); gk.appendChild(el("span", "gloss", "“" + r.gloss + "”"));
      t.appendChild(h2); t.appendChild(gk); t.appendChild(el("p", null, r.sub));
      head.appendChild(t);
      sec.appendChild(head);
      list.forEach(function (s, k) {
        n += 1;
        sec.appendChild(storyEl(s, n, n === 1, idx++));
      });
      root.appendChild(sec);
      sections.push({ id: key, el: sec });
    });
  }

  /* ---- chips, progress ---- */
  function renderChips() {
    var c = $("chips");
    c.textContent = "";
    var items = [{ id: "logos", mark: "Λ", name: "Logos" }].concat(sections.map(function (s) {
      return { id: s.id, mark: REALMS[s.id].mark, name: REALMS[s.id].name };
    }));
    items.forEach(function (it) {
      var b = el("button", "chip " + (it.id === "logos" ? "" : it.id));
      b.type = "button"; b.dataset.id = it.id; b.setAttribute("role", "tab");
      b.appendChild(el("i", null, it.mark));
      b.appendChild(document.createTextNode(it.name));
      b.addEventListener("click", function () {
        var target = $(it.id);
        if (target) target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      });
      c.appendChild(b);
    });
    spy();
  }
  function spy() {
    var chips = document.querySelectorAll(".chip");
    if (!chips.length) return;
    var ids = ["logos"].concat(sections.map(function (s) { return s.id; }));
    var current = ids[0], limit = window.innerHeight * 0.32;
    ids.forEach(function (id) {
      var e = $(id);
      if (e && e.getBoundingClientRect().top <= limit) current = id;
    });
    chips.forEach(function (b) {
      var on = b.dataset.id === current;
      b.setAttribute("aria-current", on ? "true" : "false");
      if (on && b.dataset.shown !== "1") {
        var box = $("chips");
        box.scrollTo({ left: b.offsetLeft - box.clientWidth / 2 + b.clientWidth / 2, behavior: "smooth" });
      }
      b.dataset.shown = on ? "1" : "0";
    });
  }
  var unread = 0;
  function badge() {
    if (!navigator.setAppBadge || !edition) return;
    try {
      var p = unread > 0 ? navigator.setAppBadge(unread) : navigator.clearAppBadge();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }
  function progress() {
    var read = 0;
    if (edition) edition.stories.forEach(function (s) { if (readSet[s.link]) read++; });
    unread = total - read;
    badge();
    $("count").textContent = total ? read + " / " + total : "";
    $("bar").style.width = total ? (read / total * 100) + "%" : "0";
  }
  function markRead(link) {
    if (readSet[link]) return;
    readSet[link] = 1; readList.push(link);
    saveRead();
    recordDay();
    var a = document.querySelector('.story[data-link="' + (window.CSS && CSS.escape ? CSS.escape(link) : link) + '"]');
    if (a) { a.classList.add("read"); a.querySelector(".num").textContent = "✓"; }
    progress();
  }

  /* ---- sharing ---- */
  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("on"); }, 1800);
  }
  function shareStory(s) {
    if (navigator.share) { navigator.share({ title: s.title, url: s.link }).catch(function () {}); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s.link).then(function () { toast("Link copied"); }, function () { toast("Couldn’t copy link"); });
    } else toast("Sharing isn’t available here");
  }

  /* ---- load ---- */
  var SPLASH_HOLD = 1000;   // ms the logo stays up after it has started to appear, before the launch screen fades
  // The logo starts only once iOS has finished opening and resizing the page: the size must have been
  // still for 250 ms (and at least 700 ms must have passed); after 1.4 s it starts regardless.
  var goDone = false, goQueue = [], lastSize = 0, lastMove = 0;
  function whenGo(fn) { if (goDone) fn(); else goQueue.push(fn); }
  function size() { var v = window.visualViewport; return innerWidth + "x" + innerHeight + "x" + (v ? Math.round(v.height) : 0); }
  (function () {
    var tick = setInterval(function () {
      var now = performance.now(), sz = size();
      if (sz !== lastSize) { lastSize = sz; lastMove = now; }
      if ((now >= 700 && now - lastMove >= 250) || now >= 1400) {
        clearInterval(tick); goDone = true;
        var sp = $("splash"); if (sp) sp.classList.add("go");
        var q = goQueue; goQueue = []; q.forEach(function (f) { f(); });
      }
    }, 40);
  })();
  // Web fonts are requested from the page, a moment after launch, so the opening has nothing in its head to wait for.
  whenGo(function () {
    var l = document.createElement("link");
    l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap";
    document.head.appendChild(l);
  });
  var splashQueued = false, splashGone = false, afterQueue = [];
  function afterSplash(fn) { if (splashGone) fn(); else afterQueue.push(fn); }
  function hideSplash() {
    if (splashQueued) return;
    splashQueued = true;
    whenGo(function () { setTimeout(function () {
      var sp = $("splash");
      // first paint held only the launch screen; paint the app underneath it, then fade
      document.documentElement.classList.remove("booting");
      document.documentElement.style.background = "";
      requestAnimationFrame(function () { requestAnimationFrame(function () { if (sp) sp.classList.add("off"); }); });

      setTimeout(function () {
        if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
        splashGone = true;
        var q = afterQueue; afterQueue = [];
        q.forEach(function (fn) { try { fn(); } catch (e) {} });
      }, 650);
    }, SPLASH_HOLD); });
  }

  function apply(data) {
    var again = !!edition;
    edition = data; total = (data.stories || []).length;
    var saved = store("lyceum-read");
    readSet = {}; readList = (saved && saved.links) || [];
    readList.forEach(function (l) { readSet[l] = 1; });
    idbPut("read", readList);
    weather = data.weather || [];
    clocks();
    renderMaxim(data.maxims);
    renderReading(data.reading);
    renderStories(data.stories || []);
    $("edition").classList.toggle("noanim", again);
    renderChips();
    progress();
    brief();
    var names = {};
    (data.stories || []).forEach(function (s) { names[s.source] = 1; });
    $("sources").textContent = "Sources: " + Object.keys(names).sort().join(", ") + ".";
    $("updated").textContent = "Edition compiled " + ago(data.generated);
    $("footer").hidden = false;
  }

  function load(manual) {
    var btn = $("refresh");
    btn.classList.add("spin");
    return fetch("news.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        if (!edition || edition.generated !== data.generated) {
          store("lyceum-edition", data);
          var busy = window.scrollY > 40 || !$("reader").hidden;
          if (!edition || manual || !busy) apply(data);      // otherwise it is saved and shown on the next launch
        }
        else $("updated").textContent = "Edition compiled " + ago(data.generated);
        lastLoaded = Date.now();
        hideSplash();
      })
      .catch(function () {
        hideSplash();
        if (!lastLoaded) {
          $("edition").textContent = "";
          $("edition").appendChild(el("p", "note", "Today’s edition is not ready yet. Check your connection and tap refresh."));
        }
      })
      .then(function () { setTimeout(function () { btn.classList.remove("spin"); }, 450); });
  }

  header();
  setInterval(clocks, 30000);
  $("refresh").addEventListener("click", function () { header(); load(true); });
  $("edition").addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a.cover");
    if (a) markRead(a.closest(".story").dataset.link);
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { badge(); return; }
    if (Date.now() - lastLoaded > 30 * 60 * 1000) { header(); load(); }
  });
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (!ticking) { ticking = true; requestAnimationFrame(function () { spy(); ticking = false; }); }
  }, { passive: true });

  var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone && !store("lyceum-banner")) $("install").hidden = false;
  /* ---- morning alert (Web Push) ---- */
  var VAPID_PUBLIC = "BMlqRDcKziZ_BnZxIYy1a0Et_I3rf-v1kUsgeXP_WaFl9dB9t7vZPHLM8vr_Jyd7YWRlJfP_P-xSTbdTiOiIR-k";
  var REPO = "https://github.com/vibhordube182-web/Iphone-apps-personal/settings/secrets/actions/";
  var DEFAULT_TZ = "Australia/Melbourne";   // what the sender assumes when the code has no timezone
  function currentTz() { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || DEFAULT_TZ; } catch (e) { return DEFAULT_TZ; } }
  function connectionCode(sub) { var o = sub.toJSON(); o.tz = currentTz(); return JSON.stringify(o); }
  function copyText(text, ta, okMsg) {
    var fallback = function () { if (ta) { ta.focus(); ta.select(); } toast("Select and copy it"); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback); else fallback();
  }
  function keyBytes(b64) {
    b64 = b64.replace(/-/g, "+").replace(/_/g, "/");
    var raw = atob(b64 + "=".repeat((4 - b64.length % 4) % 4)), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  function pushSupported() {
    return standalone && "serviceWorker" in navigator && "PushManager" in window && window.Notification;
  }
  function pill(text, cls, fn) { var b = el("button", "pill " + (cls || ""), text); b.type = "button"; b.addEventListener("click", fn); return b; }
  function showAlert(kind, sub) {
    var box = $("alert"); box.textContent = ""; box.hidden = false;
    if (kind === "ask") {
      box.appendChild(el("h4", null, "Morning alert and icon badge"));
      box.appendChild(el("p", null, "Four times a day (6am, 12pm, 5pm and 9pm, wherever you are) Lyceum nudges you to read, and the icon shows how many stories you haven’t opened. iPhone only allows a badge to update by itself when notifications are on."));
      var acts = el("div", "acts");
      acts.appendChild(pill("Turn on", "solid", function () {
        Notification.requestPermission().then(function (perm) {
          if (perm !== "granted") { box.hidden = true; toast("Notifications are off for Lyceum in iPhone Settings"); return; }
          return navigator.serviceWorker.ready.then(function (reg) {
            return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(VAPID_PUBLIC) });
          }).then(function () { store("lyceum-push-done", 0); return refreshAlert(); });
        }).catch(function (e) { toast("Couldn’t turn on: " + ((e && e.message) || e)); });
      }));
      acts.appendChild(pill("Not now", "", function () { box.hidden = true; }));
      box.appendChild(acts);
    } else {
      var tzNow = currentTz(), changed = kind === "tz";
      var url = REPO + (changed ? "PUSH_SUBSCRIPTION" : "new");
      var json = connectionCode(sub);
      box.appendChild(el("h4", null, changed ? "Your timezone changed to " + tzNow.replace(/_/g, " ") : "One last step to connect this phone"));
      box.appendChild(el("p", null, changed
        ? "Alerts follow the timezone in your connection code. Copy the new code, open the secret page, paste it over the old value and save. Then it is 6am, 12pm, 5pm and 9pm in " + tzNow.replace(/_/g, " ") + " too."
        : "Copy this phone’s code, then add it as a secret named PUSH_SUBSCRIPTION in your GitHub repository. Do this once."));
      var ta = el("textarea"); ta.readOnly = true; ta.value = json; ta.id = "pushcode"; box.appendChild(ta);
      var a2 = el("div", "acts");
      a2.appendChild(pill("Copy code", "solid", function () { copyText(json, ta, "Code copied"); }));
      var open = el("a", "pill", changed ? "Open secret page" : "Open GitHub secrets"); open.href = url; open.target = "_blank"; open.rel = "noopener"; a2.appendChild(open);
      a2.appendChild(pill("Copy link", "", function () { copyText(url, null, "Link copied"); }));
      a2.appendChild(pill(changed ? "Done" : "I’ve added it", "", function () { store("lyceum-push-done", 1); store("lyceum-tz", tzNow); box.hidden = true; }));
      box.appendChild(a2);
      var urlLine = el("p", "why", url); urlLine.style.cssText = "font:11px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;margin:2px 0 0"; box.appendChild(urlLine);
    }
  }
  function refreshAlert(forceConnect) {
    var box = $("alert");
    if (!pushSupported()) { box.hidden = true; return Promise.resolve(); }
    $("alertLink").hidden = false;
    return navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) {
      if (!sub) { if (Notification.permission === "denied") { box.hidden = true; return; } showAlert("ask"); return; }
      if (forceConnect || !store("lyceum-push-done")) { showAlert("connect", sub); return; }
      if ((store("lyceum-tz") || DEFAULT_TZ) !== currentTz()) showAlert("tz", sub); else box.hidden = true;
    }).catch(function () { box.hidden = true; });
  }
  $("alertLink").addEventListener("click", function () { window.scrollTo({ top: 0 }); refreshAlert(true); });
  afterSplash(refreshAlert);
  $("dismiss").addEventListener("click", function () { $("install").hidden = true; store("lyceum-banner", 1); });

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    afterSplash(function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }

  // Paint the last edition straight away, then refresh quietly behind it.
  var saved0 = store("lyceum-edition");
  if (saved0 && saved0.stories) {
    try { apply(saved0); lastLoaded = 1; } catch (e) { edition = null; }
    requestAnimationFrame(function () { requestAnimationFrame(hideSplash); });
    afterSplash(load);                       // refresh quietly once the launch screen has faded
  } else {
    load();                                  // first ever launch: there is nothing to show yet
  }

}
// Paint the black launch screen first; the heavy work (building the edition) waits until iOS has finished
// its own opening animation (about half a second in), while the launch screen covers the page.
setTimeout(lyceumMain, Math.max(0, 500 - performance.now()));
