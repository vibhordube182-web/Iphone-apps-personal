<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyceum</title>
<meta name="description" content="A morning news briefing with Greek philosophy.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="mark-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="mark-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lyceum">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1d3d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap">
<style>
  /* Layout: navy masthead band, sticky section bar, then one reading column.
     Serif for reading, system sans for interface chrome, Cinzel for the brand only. */
  :root {
    --paper: #eef0ec; --card: #fafaf7; --ink: #0f1b33; --muted: #566074; --rule: #d6dad4;
    --aegean: #1b4b82; --gold: #7c5f1a; --clay: #a33f23; --olive: #52632c; --teal: #0e6f69; --violet: #5a4aa8; --plum: #98386f;
    --bar: rgba(238, 240, 236, 0.84); --shadow: 0 1px 2px rgba(15, 27, 51, .06), 0 8px 24px -12px rgba(15, 27, 51, .18);
    --navy: #0b1d3d; --navy-2: #16396a; --ivory: #f3efe3; --brass: #e0c57a;
    --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
    --greek: "EB Garamond", "Iowan Old Style", Palatino, Georgia, serif;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    --bar-h: 54px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0a1222; --card: #111b32; --ink: #ece9de; --muted: #98a3b9; --rule: #212e4c;
      --aegean: #8db8ea; --gold: #ddbd6a; --clay: #ea926c; --olive: #afc17d; --teal: #5fc4b8; --violet: #aa9ef2; --plum: #e68cbf;
      --bar: rgba(10, 18, 34, 0.84); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0a1222; --card: #111b32; --ink: #ece9de; --muted: #98a3b9; --rule: #212e4c;
    --aegean: #8db8ea; --gold: #ddbd6a; --clay: #ea926c; --olive: #afc17d; --teal: #5fc4b8; --violet: #aa9ef2; --plum: #e68cbf;
    --bar: rgba(10, 18, 34, 0.84); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--serif); font-size: 17px; line-height: 1.5;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  }
  /* Paints the status-bar area navy so the clock stays readable in either theme. */
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    background: var(--navy); z-index: 60;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--aegean); outline-offset: 3px; border-radius: 6px; }
  .wrap { max-width: 660px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }

  .defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .key { display: block; width: 100%; height: 20px; }

  /* ---------- Masthead ---------- */
  .masthead {
    background: radial-gradient(120% 90% at 50% 0%, var(--navy-2) 0%, var(--navy) 62%);
    color: var(--ivory); text-align: center; position: relative; overflow: hidden;
    padding-top: calc(env(safe-area-inset-top, 0px) + 22px); padding-bottom: 0;
  }
  .masthead::after { /* faint grain */
    content: ""; position: absolute; inset: 0; opacity: .07; pointer-events: none; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  }
  .masthead .wrap { position: relative; z-index: 1; }
  .emblem { width: 58px; height: 40px; color: var(--brass); display: block; margin: 0 auto 10px; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 2.35rem; letter-spacing: .36em; padding-left: .36em; line-height: 1; margin: 0; }
  .dateline { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 14px auto 0; color: var(--brass); font-family: var(--ui); font-size: .68rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
  .dateline::before, .dateline::after { content: ""; height: 1px; width: 38px; background: currentColor; opacity: .5; }
  .greeting { margin: 22px 0 0; }
  .greeting .greek { font-family: var(--greek); font-size: 1.9rem; font-weight: 500; line-height: 1.1; }
  .greeting .english { font-size: .98rem; color: color-mix(in srgb, var(--ivory) 72%, transparent); margin-top: 4px; }
  .brief { font-family: var(--ui); font-size: .76rem; letter-spacing: .04em; color: color-mix(in srgb, var(--ivory) 62%, transparent); margin: 14px 0 18px; min-height: 1.1em; }
  .masthead .key { opacity: .75; }
  .cities { display: flex; justify-content: center; gap: 0; margin: 4px auto 0; max-width: 360px; font-family: var(--ui); }
  .city { flex: 1; padding: 0 12px; text-align: center; }
  .city + .city { border-left: 1px solid color-mix(in srgb, var(--ivory) 22%, transparent); }
  .city .cn { font-size: .62rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); font-variant-numeric: tabular-nums; }
  .city .cw { font-size: .8rem; color: color-mix(in srgb, var(--ivory) 80%, transparent); margin-top: 2px; }

  /* ---------- Sticky bar ---------- */
  .bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
    background: var(--bar); -webkit-backdrop-filter: saturate(1.6) blur(16px); backdrop-filter: saturate(1.6) blur(16px);
    border-bottom: 1px solid var(--rule);
  }
  .bar-in { display: flex; align-items: center; gap: 6px; height: var(--bar-h); }
  .chips { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chips { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 22px), transparent); padding-right: 22px; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px 0 6px;
    border: 1px solid transparent; border-radius: 999px; background: none; cursor: pointer;
    font-family: var(--ui); font-size: .82rem; font-weight: 600; color: var(--muted);
    transition: background .2s, color .2s, border-color .2s, transform .15s;
  }
  .chip i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--greek); font-size: .98rem; font-weight: 500; color: var(--paper); background: var(--tint, var(--gold)); }
  .chip:active { transform: scale(.95); }
  .chip[aria-current="true"] { color: var(--ink); background: var(--card); border-color: var(--rule); box-shadow: var(--shadow); }
  .tools { flex: none; display: flex; align-items: center; gap: 2px; }
  .count { font-family: var(--ui); font-size: .76rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; padding: 0 4px; }
  .iconbtn { width: 40px; height: 40px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: var(--muted); cursor: pointer; transition: transform .15s, background .2s; }
  .iconbtn:active { transform: scale(.88); background: var(--rule); }
  .iconbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .iconbtn.spin svg { animation: spin .9s linear infinite; }
  .progress { height: 2px; background: transparent; }
  .progress i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Banner ---------- */
  .banner { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; padding: 12px 8px 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--rule); font-family: var(--ui); font-size: .84rem; line-height: 1.4; color: var(--muted); }
  .banner b { color: var(--ink); }
  .banner p { margin: 0; flex: 1; }
  .banner[hidden] { display: none; }
  .alertcard { flex-direction: column; gap: 8px; padding: 16px; }
  .alertcard h4 { margin: 0; font-family: var(--serif); font-size: 1.05rem; color: var(--ink); }
  .alertcard textarea { width: 100%; height: 76px; resize: none; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); color: var(--muted); font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 8px; }
  .alertcard .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

  /* ---------- Daily Logos ---------- */
  .logos { position: relative; overflow: hidden; margin-top: 20px; padding: 26px 22px 22px; text-align: center; border-radius: 18px; background: var(--card); border: 1px solid color-mix(in srgb, var(--gold) 55%, var(--rule)); box-shadow: var(--shadow); scroll-margin-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 10px); }
  .logos .wm { position: absolute; right: -10px; bottom: -34px; font-family: var(--greek); font-style: italic; font-size: 8.5rem; line-height: 1; color: var(--gold); opacity: .09; pointer-events: none; user-select: none; }
  .logos > * { position: relative; }
  .eyebrow { font-family: var(--ui); font-size: .66rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
  .logos blockquote { margin: 14px 0 10px; font-family: var(--greek); font-style: italic; font-size: 1.55rem; line-height: 1.25; text-wrap: balance; }
  .logos .author { font-family: var(--ui); font-size: .8rem; font-weight: 600; color: var(--aegean); letter-spacing: .02em; }
  .logos hr { border: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--rule) 20%, var(--rule) 80%, transparent); margin: 18px 0 14px; }
  .logos .lens { margin: 8px auto 0; max-width: 34ch; font-size: .98rem; line-height: 1.45; color: var(--muted); text-wrap: pretty; }

  /* ---------- Today's reading ---------- */
  .reading { margin-top: 14px; padding: 16px 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--rule); display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 14px; align-items: start; }
  .reading .ico { grid-row: 1 / span 3; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--olive) 16%, var(--card)); color: var(--olive); }
  .reading .ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .reading h3 { margin: 2px 0 0; font-size: 1.12rem; line-height: 1.25; font-weight: 650; }
  .reading .by { font-family: var(--ui); font-size: .72rem; color: var(--muted); margin: 0; }
  .reading .why { margin: 4px 0 0; font-size: .95rem; line-height: 1.42; color: var(--muted); }
  .reading .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--rule); background: none; font-family: var(--ui); font-size: .8rem; font-weight: 600; color: var(--ink); cursor: pointer; transition: transform .15s, background .2s; }
  .pill:active { transform: scale(.95); }
  .pill.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .pill.done { background: var(--olive); border-color: var(--olive); color: var(--paper); }

  /* ---------- Realms & stories ---------- */
  .realm { scroll-margin-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 6px); }
  .polis { --tint: var(--clay); } .oikos { --tint: var(--teal); } .techne { --tint: var(--aegean); } .kosmos { --tint: var(--violet); }
  .oikonomia { --tint: var(--gold); } .arete { --tint: var(--olive); } .sophia { --tint: var(--muted); } .schole { --tint: var(--plum); }
  .realm-head { display: flex; align-items: center; gap: 13px; margin: 38px 0 4px; }
  .mark { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-family: var(--greek); font-size: 1.65rem; font-weight: 500; color: var(--paper); background: var(--tint); box-shadow: 0 0 0 4px color-mix(in srgb, var(--tint) 18%, transparent); }
  .realm-head h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.22rem; letter-spacing: .1em; line-height: 1.1; }
  .realm-head h2 span { font-family: var(--greek); font-weight: 500; letter-spacing: 0; font-size: 1.1rem; color: var(--tint); margin-left: 9px; }
  .realm-head p { margin: 3px 0 0; font-family: var(--ui); font-size: .68rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  .story { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 14px; padding: 16px 0 18px; border-top: 1px solid var(--rule); transition: transform .15s; animation: rise .55s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 45ms); }
  .story:first-of-type { border-top: 0; }
  .story:active { transform: scale(.992); }
  .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-family: var(--ui); font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .num { flex: none; width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; font-size: .66rem; letter-spacing: 0; color: var(--tint); border: 1.5px solid var(--tint); font-variant-numeric: tabular-nums; transition: background .25s, color .25s; }
  .story h3 { margin: 0 0 7px; font-size: 1.2rem; line-height: 1.22; font-weight: 650; letter-spacing: -.005em; text-wrap: balance; transition: color .25s; }
  .story p { margin: 0; font-size: .97rem; line-height: 1.45; color: color-mix(in srgb, var(--ink) 78%, var(--paper)); text-wrap: pretty; }
  .story a.cover::after { content: ""; position: absolute; inset: 0; }
  .share { position: relative; z-index: 2; margin: -10px -10px -10px auto; width: 34px; height: 34px; }
  .share svg { width: 17px; height: 17px; }
  .thumb { grid-column: 2; grid-row: 1 / span 2; align-self: start; width: 92px; height: 92px; border-radius: 12px; overflow: hidden; background: color-mix(in srgb, var(--tint) 14%, var(--card)); margin-top: 24px; }
  .thumb img, .hero-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .3s; }
  .story.read h3 { color: var(--muted); font-weight: 500; }
  .story.read .num { background: var(--tint); color: var(--paper); }
  .story.read .thumb img, .story.read .hero-img img { opacity: .55; }

  /* Lead story of the edition */
  .story.lead { display: block; padding: 18px 0 22px; border-top: 0; }
  .hero-img { aspect-ratio: 16 / 10; border-radius: 16px; overflow: hidden; margin-bottom: 14px; background: color-mix(in srgb, var(--tint) 14%, var(--card)); box-shadow: var(--shadow); }
  .lead h3 { font-size: 1.62rem; line-height: 1.14; font-weight: 700; letter-spacing: -.012em; margin-bottom: 9px; }
  .lead p { font-size: 1.04rem; }
  .lead .tag { color: var(--tint); }
  .lead .share { position: absolute; right: -6px; top: calc(100% - 52px); margin: 0; }

  /* Skeletons & states */
  .skel { padding: 20px 0; border-top: 1px solid var(--rule); }
  .skel i { display: block; height: 12px; border-radius: 6px; margin-bottom: 11px; background: linear-gradient(90deg, var(--rule) 25%, color-mix(in srgb, var(--rule) 40%, var(--paper)) 50%, var(--rule) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }
  .skel i:nth-child(1) { width: 38%; height: 9px; } .skel i:nth-child(2) { width: 92%; height: 18px; } .skel i:nth-child(3) { width: 70%; height: 18px; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .note { text-align: center; color: var(--muted); font-style: italic; padding: 48px 12px; }

  /* ---------- Footer ---------- */
  footer { text-align: center; padding: 42px 0 18px; }
  footer .key { max-width: 220px; margin: 0 auto; color: var(--gold); }
  footer .done { font-size: 1.3rem; font-weight: 650; margin: 18px 0 2px; }
  footer .chaire { font-family: var(--greek); font-style: italic; font-size: 1.15rem; color: var(--aegean); }
  footer .know { font-family: var(--ui); font-size: .64rem; font-weight: 700; letter-spacing: .22em; color: var(--gold); text-transform: uppercase; margin: 16px 0 14px; }
  footer .src { font-family: var(--ui); font-size: .72rem; line-height: 1.6; color: var(--muted); max-width: 40ch; margin: 0 auto; }
  footer .updated { font-family: var(--ui); font-size: .72rem; color: var(--muted); margin-top: 10px; }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translate(-50%, 20px); opacity: 0; z-index: 70; background: var(--ink); color: var(--paper); font-family: var(--ui); font-size: .84rem; font-weight: 600; padding: 10px 16px; border-radius: 999px; box-shadow: var(--shadow); pointer-events: none; transition: opacity .25s, transform .25s; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .story, .iconbtn.spin svg, .skel i { animation: none; }
    .progress i, .toast, .chip { transition: none; }
  }
  @media (min-width: 700px) {
    body { font-size: 18px; } .brand { font-size: 2.9rem; } .story h3 { font-size: 1.3rem; } .lead h3 { font-size: 1.9rem; }
    .thumb { width: 118px; height: 118px; }
  }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="key-brass" width="24" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 19.2H24M0 19.2V.8H19.2V15.2H8V8H12V12" fill="none" style="stroke: var(--brass)" stroke-width="1.4" stroke-linecap="square"/>
    </pattern>
    <pattern id="key-gold" width="24" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 19.2H24M0 19.2V.8H19.2V15.2H8V8H12V12" fill="none" style="stroke: var(--gold)" stroke-width="1.4" stroke-linecap="square"/>
    </pattern>
  </defs>
</svg>

<header class="masthead">
  <div class="wrap">
    <svg class="emblem" viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 15 32 3l27 12Z"/><path d="M5 19h54M2 41h60M4 44h56" stroke-linecap="round"/>
      <path d="M11 23v15M22 23v15M32 23v15M42 23v15M53 23v15" stroke-linecap="round" stroke-width="3.4"/>
    </svg>
    <h1 class="brand">LYCEUM</h1>
    <div class="dateline" id="date"></div>
    <div class="greeting"><div class="greek" id="greek"></div><div class="english" id="english"></div></div>
    <div class="cities" id="cities"></div>
    <div class="brief" id="brief"></div>
  </div>
  <svg class="key" aria-hidden="true"><rect width="100%" height="20" fill="url(#key-brass)"/></svg>
</header>

<nav class="bar" aria-label="Sections">
  <div class="wrap bar-in">
    <div class="chips" id="chips" role="tablist"></div>
    <div class="tools">
      <span class="count" id="count" aria-live="polite"></span>
      <button class="iconbtn" id="refresh" type="button" aria-label="Refresh edition">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
</nav>

<main class="wrap">
  <div class="banner" id="install" hidden>
    <p><b>Keep Lyceum on your Home Screen.</b> In Safari, tap Share, then Add to Home Screen.</p>
    <button class="iconbtn" id="dismiss" type="button" aria-label="Dismiss"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>

  <div class="banner alertcard" id="alert" hidden></div>

  <section class="logos" id="logos" aria-label="Daily Logos"></section>
  <section class="reading" id="reading" aria-label="Today’s reading" hidden></section>

  <div id="edition">
    <div class="skel"><i></i><i></i><i></i></div>
    <div class="skel"><i></i><i></i><i></i></div>
    <div class="skel"><i></i><i></i><i></i></div>
  </div>

  <footer id="footer" hidden>
    <svg class="key" aria-hidden="true"><rect width="100%" height="20" fill="url(#key-gold)"/></svg>
    <div class="done">That is all for now.</div>
    <div class="chaire" id="chaire">Χαῖρε — until tomorrow.</div>
    <div class="know">γνῶθι σεαυτόν · know thyself</div>
    <div class="src" id="sources"></div>
    <div class="updated" id="updated"></div>
    <button class="pill" id="alertLink" type="button" hidden style="margin-top:14px">Morning alert settings</button>
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var NAME = "Vibhor";
  var CITIES = [{ label: "Melbourne", tz: "Australia/Melbourne" }, { label: "Mumbai", tz: "Asia/Kolkata" }];
  var REALMS = {
    polis:     { name: "Polis",     greek: "Πόλις",     sub: "Geopolitics & the world",       mark: "Π" },
    oikos:     { name: "Oikos",     greek: "Οἶκος",     sub: "Home & away: Australia, India", mark: "Ο" },
    techne:    { name: "Techne",    greek: "Τέχνη",     sub: "Technology & AI",               mark: "Τ" },
    kosmos:    { name: "Kosmos",    greek: "Κόσμος",    sub: "Space, EVs & the Musk orbit",   mark: "Κ" },
    oikonomia: { name: "Oikonomia", greek: "Οἰκονομία", sub: "Markets & business",            mark: "Χ" },
    arete:     { name: "Arete",     greek: "Ἀρετή",     sub: "Discipline & longevity",        mark: "Α" },
    sophia:    { name: "Sophia",    greek: "Σοφία",     sub: "Ideas worth your time",         mark: "Σ" },
    schole:    { name: "Schole",    greek: "Σχολή",     sub: "Rock, football & play",         mark: "Φ" }
  };
  var ORDER = ["polis", "oikos", "techne", "kosmos", "oikonomia", "arete", "sophia", "schole"];
  var BOOK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5Z"/><path d="M4 19V5.5M8 7h8"/></svg>';
  var SHARE_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  var $ = function (id) { return document.getElementById(id); };
  var lastLoaded = 0, edition = null, readSet = {}, readList = [], total = 0, sections = [];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function idbPut(key, val) {
    try {
      var r = indexedDB.open("lyceum", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
      r.onsuccess = function () { try { r.result.transaction("kv", "readwrite").objectStore("kv").put(val, key); } catch (e) {} };
    } catch (e) {}
  }
  function saveRead() {
    readList = readList.slice(-500);
    store("lyceum-read", { links: readList });
    idbPut("read", readList);
  }
  function store(key, val) {
    try { if (val === undefined) return JSON.parse(localStorage.getItem(key)); localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; }
  }

  /* ---- masthead ---- */
  function header() {
    var now = new Date(), h = now.getHours();
    $("date").textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
    var g = h >= 4 && h < 12 ? ["Καλημέρα", "Good morning"] : h >= 12 && h < 18 ? ["Χαῖρε", "Good afternoon"] : ["Καλησπέρα", "Good evening"];
    $("greek").textContent = g[0] + ", " + NAME;
    $("english").textContent = g[1] + ". Here is what matters today.";
    $("chaire").textContent = "Χαῖρε, " + NAME + " — until tomorrow.";
    clocks();
  }
  var weather = [];
  function clocks() {
    var box = $("cities");
    if (!box.children.length) {
      CITIES.forEach(function (c) {
        var d = el("div", "city"); d.appendChild(el("div", "cn")); d.appendChild(el("div", "cw")); box.appendChild(d);
      });
    }
    CITIES.forEach(function (c, i) {
      var t = new Date().toLocaleTimeString("en-AU", { timeZone: c.tz, hour: "numeric", minute: "2-digit", hour12: true }).toUpperCase();
      var w = weather.filter(function (x) { return x.city === c.label; })[0];
      box.children[i].children[0].textContent = c.label + " · " + t;
      box.children[i].children[1].textContent = w ? w.lo + "°–" + w.hi + "°  " + w.desc : " ";
    });
  }
  function dayKey(d) { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function dayNumber() { var d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
  function recordDay() {
    var days = store("lyceum-days") || [], k = dayKey();
    if (days.indexOf(k) < 0) { days.push(k); store("lyceum-days", days.slice(-400)); }
    brief();
  }
  function streak() {
    var set = {}, n = 0, d = new Date();
    (store("lyceum-days") || []).forEach(function (k) { set[k] = 1; });
    if (!set[dayKey(d)]) d.setDate(d.getDate() - 1);
    while (set[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  var briefBase = "";
  function brief() {
    var n = streak();
    $("brief").textContent = briefBase + (n ? " · " + n + "-day streak" : "");
  }
  function ago(iso) {
    var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (isNaN(m) || m < 0) return "";
    if (m < 60) return Math.max(m, 1) + "m ago";
    if (m < 1440) return Math.round(m / 60) + "h ago";
    return Math.round(m / 1440) + "d ago";
  }
  function words(s) { return s ? s.split(/\s+/).length : 0; }

  /* ---- daily logos ---- */
  function renderMaxim(maxims) {
    var box = $("logos");
    if (!maxims || !maxims.length) { box.hidden = true; return; }
    box.hidden = false;
    var d = new Date();
    var day = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
    var m = maxims[day % maxims.length];
    box.textContent = "";
    box.appendChild(el("div", "wm", "λόγος")).setAttribute("aria-hidden", "true");
    box.appendChild(el("div", "eyebrow", "The Daily Logos"));
    box.appendChild(el("blockquote", null, "“" + m.text + "”"));
    box.appendChild(el("div", "author", "— " + m.author));
    box.appendChild(document.createElement("hr"));
    box.appendChild(el("div", "eyebrow", "A lens for today’s news"));
    box.appendChild(el("p", "lens", m.lens));
  }

  /* ---- today's reading ---- */
  function renderReading(list) {
    var box = $("reading");
    if (!list || !list.length) { box.hidden = true; return; }
    var r = list[dayNumber() % list.length], done = store("lyceum-reading") === dayKey();
    box.hidden = false; box.textContent = "";
    var ico = el("div", "ico"); ico.innerHTML = BOOK_SVG; box.appendChild(ico);
    var head = el("div"); head.appendChild(el("div", "eyebrow", "Today’s reading")); box.appendChild(head);
    box.appendChild(el("h3", null, r.work + " · " + r.part));
    box.appendChild(el("p", "by", r.author + " · about " + r.minutes + " min"));
    box.appendChild(el("p", "why", r.why));
    var acts = el("div", "acts");
    var open = el("a", "pill solid", "Open the text"); open.href = r.url; open.target = "_blank"; open.rel = "noopener";
    var tick = el("button", "pill" + (done ? " done" : ""), done ? "✓ Read today" : "Mark as read"); tick.type = "button";
    tick.addEventListener("click", function () {
      var now = store("lyceum-reading") === dayKey();
      store("lyceum-reading", now ? "" : dayKey());
      if (!now) recordDay();
      renderReading(list);
    });
    acts.appendChild(open); acts.appendChild(tick);
    box.appendChild(acts);
    // the grid places the first two children (icon, eyebrow) in row 1; the rest flow in column 2
    [].slice.call(box.children, 1).forEach(function (c) { c.style.gridColumn = "2"; });
  }

  /* ---- stories ---- */
  function picture(s, cls) {
    if (!s.image) return null;
    var wrap = el("div", cls), img = new Image();
    img.alt = ""; img.decoding = "async"; img.referrerPolicy = "no-referrer";
    img.loading = cls === "hero-img" ? "eager" : "lazy";
    img.onerror = function () {
      if (s.image_alt && img.src !== s.image_alt) { img.src = s.image_alt; return; }
      wrap.remove();
      var row = img.closest && img.closest(".story");
    };
    img.src = s.image;
    wrap.appendChild(img);
    return wrap;
  }

  function storyEl(s, n, lead, i) {
    var a = el("article", "story" + (lead ? " lead" : "") + (readSet[s.link] ? " read" : ""));
    a.style.setProperty("--i", i);
    a.dataset.link = s.link;
    var body = el("div", "body");
    var meta = el("div", "meta");
    var num = el("span", "num", readSet[s.link] ? "✓" : String(n));
    meta.appendChild(num);
    meta.appendChild(el("span", lead ? "tag" : null, s.source + " · " + ago(s.date)));
    body.appendChild(meta);
    var h = el("h3"), link = el("a", "cover", s.title);
    link.href = s.link; link.target = "_blank"; link.rel = "noopener";
    h.appendChild(link);
    body.appendChild(h);
    if (s.summary) body.appendChild(el("p", null, s.summary));

    var share = el("button", "iconbtn share");
    share.type = "button"; share.setAttribute("aria-label", "Share: " + s.title);
    share.innerHTML = SHARE_SVG;
    share.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); shareStory(s); });

    var pic = picture(s, lead ? "hero-img" : "thumb");
    if (lead) {
      if (pic) a.appendChild(pic);
      a.appendChild(body); a.appendChild(share);
    } else {
      a.appendChild(body);
      if (pic) a.appendChild(pic);
      meta.appendChild(share);
      share.style.marginLeft = "auto";
    }
    return a;
  }

  function renderStories(stories) {
    var root = $("edition"), n = 0, idx = 0;
    root.textContent = "";
    sections = [];
    ORDER.forEach(function (key) {
      var list = stories.filter(function (s) { return s.realm === key; });
      if (!list.length) return;
      var r = REALMS[key], sec = el("section", "realm " + key);
      sec.id = key;
      var head = el("div", "realm-head");
      head.appendChild(el("div", "mark", r.mark)).setAttribute("aria-hidden", "true");
      var t = el("div"), h2 = el("h2", null, r.name);
      h2.appendChild(el("span", null, r.greek));
      t.appendChild(h2); t.appendChild(el("p", null, r.sub));
      head.appendChild(t);
      sec.appendChild(head);
      list.forEach(function (s, k) {
        n += 1;
        sec.appendChild(storyEl(s, n, n === 1, idx++));
      });
      root.appendChild(sec);
      sections.push({ id: key, el: sec });
    });
  }

  /* ---- chips, progress ---- */
  function renderChips() {
    var c = $("chips");
    c.textContent = "";
    var items = [{ id: "logos", mark: "Λ", name: "Logos" }].concat(sections.map(function (s) {
      return { id: s.id, mark: REALMS[s.id].mark, name: REALMS[s.id].name };
    }));
    items.forEach(function (it) {
      var b = el("button", "chip " + (it.id === "logos" ? "" : it.id));
      b.type = "button"; b.dataset.id = it.id; b.setAttribute("role", "tab");
      b.appendChild(el("i", null, it.mark));
      b.appendChild(document.createTextNode(it.name));
      b.addEventListener("click", function () {
        var target = $(it.id);
        if (target) target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      });
      c.appendChild(b);
    });
    spy();
  }
  function spy() {
    var chips = document.querySelectorAll(".chip");
    if (!chips.length) return;
    var ids = ["logos"].concat(sections.map(function (s) { return s.id; }));
    var current = ids[0], limit = window.innerHeight * 0.32;
    ids.forEach(function (id) {
      var e = $(id);
      if (e && e.getBoundingClientRect().top <= limit) current = id;
    });
    chips.forEach(function (b) {
      var on = b.dataset.id === current;
      b.setAttribute("aria-current", on ? "true" : "false");
      if (on && b.dataset.shown !== "1") {
        var box = $("chips");
        box.scrollTo({ left: b.offsetLeft - box.clientWidth / 2 + b.clientWidth / 2, behavior: "smooth" });
      }
      b.dataset.shown = on ? "1" : "0";
    });
  }
  var unread = 0;
  function badge() {
    if (!navigator.setAppBadge || !edition) return;
    try {
      var p = unread > 0 ? navigator.setAppBadge(unread) : navigator.clearAppBadge();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }
  function progress() {
    var read = 0;
    if (edition) edition.stories.forEach(function (s) { if (readSet[s.link]) read++; });
    unread = total - read;
    badge();
    $("count").textContent = total ? read + " / " + total : "";
    $("bar").style.width = total ? (read / total * 100) + "%" : "0";
  }
  function markRead(link) {
    if (readSet[link]) return;
    readSet[link] = 1; readList.push(link);
    saveRead();
    recordDay();
    var a = document.querySelector('.story[data-link="' + (window.CSS && CSS.escape ? CSS.escape(link) : link) + '"]');
    if (a) { a.classList.add("read"); a.querySelector(".num").textContent = "✓"; }
    progress();
  }

  /* ---- sharing ---- */
  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("on"); }, 1800);
  }
  function shareStory(s) {
    if (navigator.share) { navigator.share({ title: s.title, url: s.link }).catch(function () {}); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s.link).then(function () { toast("Link copied"); }, function () { toast("Couldn’t copy link"); });
    } else toast("Sharing isn’t available here");
  }

  /* ---- load ---- */
  function load() {
    var btn = $("refresh");
    btn.classList.add("spin");
    return fetch("news.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        edition = data; total = (data.stories || []).length;
        var saved = store("lyceum-read");
        readSet = {}; readList = (saved && saved.links) || [];
        readList.forEach(function (l) { readSet[l] = 1; });
        idbPut("read", readList);
        weather = data.weather || [];
        clocks();
        renderMaxim(data.maxims);
        renderReading(data.reading);
        renderStories(data.stories || []);
        renderChips();
        progress();
        var w = (data.stories || []).reduce(function (a, s) { return a + words(s.title) + words(s.summary); }, 0);
        briefBase = total + " stories · about " + Math.max(2, Math.round(w / 200)) + " min to read";
        brief();
        var names = {};
        (data.stories || []).forEach(function (s) { names[s.source] = 1; });
        $("sources").textContent = "Sources: " + Object.keys(names).sort().join(", ") + ".";
        $("updated").textContent = "Edition compiled " + ago(data.generated);
        $("footer").hidden = false;
        lastLoaded = Date.now();
      })
      .catch(function () {
        if (!lastLoaded) {
          $("edition").textContent = "";
          $("edition").appendChild(el("p", "note", "Today’s edition is not ready yet. Check your connection and tap refresh."));
        }
      })
      .then(function () { setTimeout(function () { btn.classList.remove("spin"); }, 450); });
  }

  header();
  setInterval(clocks, 30000);
  $("refresh").addEventListener("click", function () { header(); load(); });
  $("edition").addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a.cover");
    if (a) markRead(a.closest(".story").dataset.link);
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { badge(); return; }
    if (Date.now() - lastLoaded > 30 * 60 * 1000) { header(); load(); }
  });
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (!ticking) { ticking = true; requestAnimationFrame(function () { spy(); ticking = false; }); }
  }, { passive: true });

  var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone && !store("lyceum-banner")) $("install").hidden = false;
  /* ---- morning alert (Web Push) ---- */
  var VAPID_PUBLIC = "BMlqRDcKziZ_BnZxIYy1a0Et_I3rf-v1kUsgeXP_WaFl9dB9t7vZPHLM8vr_Jyd7YWRlJfP_P-xSTbdTiOiIR-k";
  var SECRETS_URL = "https://github.com/vibhordube182-web/Iphone-apps-personal/settings/secrets/actions/new";
  function keyBytes(b64) {
    b64 = b64.replace(/-/g, "+").replace(/_/g, "/");
    var raw = atob(b64 + "=".repeat((4 - b64.length % 4) % 4)), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  function pushSupported() {
    return standalone && "serviceWorker" in navigator && "PushManager" in window && window.Notification;
  }
  function pill(text, cls, fn) { var b = el("button", "pill " + (cls || ""), text); b.type = "button"; b.addEventListener("click", fn); return b; }
  function showAlert(kind, sub) {
    var box = $("alert"); box.textContent = ""; box.hidden = false;
    if (kind === "ask") {
      box.appendChild(el("h4", null, "Morning alert and icon badge"));
      box.appendChild(el("p", null, "Each morning Lyceum tells you the edition is ready and puts the number of new stories on its icon. iPhone only allows a badge to update by itself when notifications are on."));
      var acts = el("div", "acts");
      acts.appendChild(pill("Turn on", "solid", function () {
        Notification.requestPermission().then(function (perm) {
          if (perm !== "granted") { box.hidden = true; toast("Notifications are off for Lyceum in iPhone Settings"); return; }
          return navigator.serviceWorker.ready.then(function (reg) {
            return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(VAPID_PUBLIC) });
          }).then(function () { store("lyceum-push-done", 0); return refreshAlert(); });
        }).catch(function (e) { toast("Couldn’t turn on: " + ((e && e.message) || e)); });
      }));
      acts.appendChild(pill("Not now", "", function () { box.hidden = true; }));
      box.appendChild(acts);
    } else {
      var json = JSON.stringify(sub.toJSON());
      box.appendChild(el("h4", null, "One last step to connect this phone"));
      box.appendChild(el("p", null, "Copy this phone’s code, then add it as a secret named PUSH_SUBSCRIPTION in your GitHub repository (Settings, Secrets and variables, Actions). Do this once."));
      var ta = el("textarea"); ta.readOnly = true; ta.value = json; ta.id = "pushcode"; box.appendChild(ta);
      var a2 = el("div", "acts");
      a2.appendChild(pill("Copy code", "solid", function () {
        var done = function () { toast("Code copied"); };
        var fallback = function () { ta.focus(); ta.select(); toast("Select and copy the code"); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(done, fallback); else fallback();
      }));
      var open = el("a", "pill", "Open GitHub secrets"); open.href = SECRETS_URL; open.target = "_blank"; open.rel = "noopener"; a2.appendChild(open);
      a2.appendChild(pill("I’ve added it", "", function () { store("lyceum-push-done", 1); box.hidden = true; }));
      box.appendChild(a2);
    }
  }
  function refreshAlert(forceConnect) {
    var box = $("alert");
    if (!pushSupported()) { box.hidden = true; return Promise.resolve(); }
    $("alertLink").hidden = false;
    return navigator.serviceWorker.ready.then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) {
      if (!sub) { if (Notification.permission === "denied") { box.hidden = true; return; } showAlert("ask"); return; }
      if (forceConnect || !store("lyceum-push-done")) showAlert("connect", sub); else box.hidden = true;
    }).catch(function () { box.hidden = true; });
  }
  $("alertLink").addEventListener("click", function () { window.scrollTo({ top: 0 }); refreshAlert(true); });
  refreshAlert();
  $("dismiss").addEventListener("click", function () { $("install").hidden = true; store("lyceum-banner", 1); });

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
  load();
})();
</script>
</body>
</html>
