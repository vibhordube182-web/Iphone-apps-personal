name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile for simulator (sanity check)
        run: |
          xcodebuild build \
            -project Lyceum.xcodeproj -scheme Lyceum \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -40

      - name: Build unsigned device app
        run: |
          xcodebuild build \
            -project Lyceum.xcodeproj -scheme Lyceum \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -20

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Lyceum.app Payload/
          zip -qry Lyceum.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Lyceum-unsigned-ipa
          path: Lyceum.ipa
