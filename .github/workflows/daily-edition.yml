name: Daily edition

# Rebuilds the news edition every morning and publishes the Lyceum web app to GitHub Pages.
on:
  schedule:
    - cron: "0 19 * * *"   # 19:00 UTC = 5-6am in Sydney/Melbourne
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", ".github/workflows/daily-edition.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch today's news
        run: python scripts/fetch_news.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Send morning alert
        if: github.event_name != 'push'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: |
          pip install pywebpush
          python scripts/send_push.py
