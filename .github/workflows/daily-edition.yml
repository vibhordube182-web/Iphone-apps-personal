name: Daily edition

# Rebuilds the news edition four times a day (6am, 12pm, 5pm, 9pm Melbourne time),
# publishes the Lyceum web app to GitHub Pages and sends the push alert.
on:
  schedule:
    # Melbourne is UTC+11 in summer and UTC+10 in winter. Cron is UTC only, so each time is
    # listed for both offsets and the "Check Melbourne time" step lets only the right one through.
    - cron: "7 19,20 * * *"   # 6am
    - cron: "7 1,2 * * *"     # 12pm
    - cron: "7 6,7 * * *"     # 5pm
    - cron: "7 10,11 * * *"   # 9pm
  push:
    branches: [main]
    paths: ["web/**", "scripts/**", ".github/workflows/daily-edition.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Melbourne time
        id: gate
        run: |
          hour=$(TZ=Australia/Melbourne date +%-H)
          if [ "${{ github.event_name }}" != "schedule" ]; then go=true
          else case "$hour" in 6|12|17|21) go=true ;; *) go=false ;; esac; fi
          echo "Melbourne hour: $hour, run: $go"
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Fetch the news
        if: steps.gate.outputs.go == 'true'
        run: python scripts/fetch_news.py
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.go == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.go == 'true'
        with:
          path: web
      - id: deployment
        if: steps.gate.outputs.go == 'true'
        uses: actions/deploy-pages@v4

      - name: Send alert
        if: steps.gate.outputs.go == 'true' && github.event_name != 'push'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: |
          pip install pywebpush
          python scripts/send_push.py
