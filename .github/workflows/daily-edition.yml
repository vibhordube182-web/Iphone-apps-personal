name: Daily edition

# Runs every hour. Each run refreshes the news and publishes the site; the push step then sends an
# alert to every phone for which it is currently 6am, 12pm, 5pm or 9pm in that phone's own timezone
# (the timezone travels inside the PUSH_SUBSCRIPTION code, so alerts follow you when you travel).
on:
  schedule:
    - cron: "7 * * * *"
  push:
    branches: [main]
    paths: ["web/**", "reelmatch/**", "scripts/**", ".github/workflows/daily-edition.yml"]
  workflow_dispatch:
    inputs:
      send_alert:
        description: "Send the push alert to connected phones"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the news
        run: python scripts/fetch_news.py
      - uses: actions/configure-pages@v5
      - name: Assemble the site (Lyceum at the root, ReelMatch under /reelmatch/)
        run: |
          mkdir -p _site/reelmatch
          cp -r web/. _site/
          rsync -a --exclude test --exclude server.js --exclude data.json reelmatch/ _site/reelmatch/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Send alert
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_alert)
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          EVENT: ${{ github.event_name }}
        run: |
          pip install pywebpush
          python scripts/send_push.py
