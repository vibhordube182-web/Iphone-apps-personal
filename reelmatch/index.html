<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AshKey Entertainment</title>
<meta name="description" content="Swipe movies together. Find what you both want to watch tonight.">
<meta name="theme-color" content="#0b0b10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AshKey">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="app" class="hidden">
  <header class="top">
    <div class="logo">Ash<b>Key</b><small>Entertainment</small></div>
    <button id="partnerStatus" class="status" aria-label="Partner status"></button>
  </header>
  <main>
    <section id="v-swipe" class="view">
      <div id="banner" class="banner hidden"></div>
      <div id="deck"></div>
      <div class="actions">
        <button id="b-undo" class="act small" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button id="b-nope" class="act nope" aria-label="Nope"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <button id="b-super" class="act super" aria-label="Super like"><svg viewBox="0 0 24 24" class="fill"><path d="m12 3 2.7 5.8 6.3.8-4.6 4.4 1.2 6.3L12 17.3 6.4 20.3l1.2-6.3L3 9.6l6.3-.8z"/></svg></button>
        <button id="b-like" class="act like" aria-label="Like"><svg viewBox="0 0 24 24" class="fill"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z"/></svg></button>
        <button id="b-info" class="act small" aria-label="Details"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
      </div>
    </section>
    <section id="v-matches" class="view scroll hidden"></section>
    <section id="v-us" class="view scroll hidden"></section>
  </main>
  <nav class="tabs">
    <button data-tab="swipe" class="on"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6"/></svg><span>Swipe</span></button>
    <button data-tab="matches"><svg viewBox="0 0 24 24" class="fill"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z"/></svg><span>Matches</span><i id="badge" class="badge hidden"></i></button>
    <button data-tab="us"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M15.5 14.8c3 0 5.5 1.7 5.5 4.7"/></svg><span>Us</span></button>
  </nav>
</div>
<div id="setup" class="screen hidden"></div>
<div id="overlay" class="hidden"></div>
<div id="toast" class="hidden"></div>
<script type="module" src="app.js"></script>
</body>
</html>
